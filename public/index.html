<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic-Tac-Toe | CI/CD Practice</title>
<style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#f8fafc;background:#0f172a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{text-align:center;padding:34px 16px 12px}h1{font-size:clamp(2rem,6vw,3.2rem);margin:0 0 8px;letter-spacing:-1px}
header p{margin:0;color:#a5b4fc}.app{width:min(92vw,480px);padding:20px 0 34px}
.panel{background:#1e293b;border:1px solid #334155;border-radius:22px;padding:22px;box-shadow:0 20px 60px #02061766}
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.score div{background:#0f172a;border:1px solid #334155;border-radius:13px;padding:12px;text-align:center}
.score strong{display:block;font-size:1.6rem}.score span{font-size:.8rem;color:#94a3b8}
.status{text-align:center;min-height:28px;font-size:1.1rem;font-weight:700;margin:8px 0 18px;color:#c7d2fe}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cell{aspect-ratio:1;border:1px solid #475569;border-radius:16px;background:#334155;color:white;font-size:clamp(2.6rem,12vw,4.4rem);font-weight:800;cursor:pointer;transition:transform .12s,background .12s}
.cell:hover:enabled{background:#475569;transform:translateY(-2px)}.cell:disabled{cursor:default}
.cell.x{color:#60a5fa}.cell.o{color:#f9a8d4}.cell.winner{background:#14532d;border-color:#4ade80}
.controls{display:flex;gap:10px;margin-top:18px}.controls button{flex:1;border:0;border-radius:12px;padding:13px;font-size:1rem;font-weight:700;cursor:pointer}
#reset{background:#818cf8;color:#0f172a}#new-round{background:#334155;color:#f8fafc}
.hint{text-align:center;color:#94a3b8;font-size:.86rem;line-height:1.5;margin:18px 0 0}
footer{color:#64748b;text-align:center;font-size:.8rem;padding:0 16px 24px}
@media(max-width:360px){.panel{padding:14px}.board{gap:7px}.cell{border-radius:11px}.score{gap:6px}}
</style>
</head>
<body>
<header><h1>⭕ Tic-Tac-Toe ❌</h1><p>Classic game · Two players · CI/CD practice project</p></header>
<main class="app">
<section class="panel">
  <div class="score">
    <div><strong id="x-score">0</strong><span>Player X</span></div>
    <div><strong id="draw-score">0</strong><span>Draws</span></div>
    <div><strong id="o-score">0</strong><span>Player O</span></div>
  </div>
  <div class="status" id="status" aria-live="polite">Player X's turn</div>
  <div class="board" id="board" aria-label="Tic-Tac-Toe board">
    <button class="cell" data-index="0" aria-label="Cell 1"></button>
    <button class="cell" data-index="1" aria-label="Cell 2"></button>
    <button class="cell" data-index="2" aria-label="Cell 3"></button>
    <button class="cell" data-index="3" aria-label="Cell 4"></button>
    <button class="cell" data-index="4" aria-label="Cell 5"></button>
    <button class="cell" data-index="5" aria-label="Cell 6"></button>
    <button class="cell" data-index="6" aria-label="Cell 7"></button>
    <button class="cell" data-index="7" aria-label="Cell 8"></button>
    <button class="cell" data-index="8" aria-label="Cell 9"></button>
  </div>
  <div class="controls"><button id="reset">Reset scores</button><button id="new-round">New round</button></div>
  <p class="hint">Take turns placing X and O. Get three in a row to win.<br>Green squares show the winning combination.</p>
</section>
</main>
<footer>Built with Node.js · Automated tests · GitHub Actions workflow</footer>
<script>
const cells=[...document.querySelectorAll(".cell")];
const status=document.querySelector("#status");
const scores={X:0,O:0,draw:0};
let board=Array(9).fill(null), current="X", finished=false;
const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function winnerLine(){
  for(const line of lines){const [a,b,c]=line;if(board[a]&&board[a]===board[b]&&board[a]===board[c])return {winner:board[a],line};}
  return board.every(Boolean)?{winner:"draw",line:[]}:null;
}
function updateScores(){
  document.querySelector("#x-score").textContent=scores.X;
  document.querySelector("#o-score").textContent=scores.O;
  document.querySelector("#draw-score").textContent=scores.draw;
}
function render(){
  cells.forEach((cell,i)=>{
    cell.textContent=board[i]||"";
    cell.className="cell"+(board[i]?" "+board[i].toLowerCase():"");
    cell.disabled=finished||Boolean(board[i]);
    cell.setAttribute("aria-label",`Cell ${i+1}${board[i]?`, ${board[i]}`:""}`);
  });
}
async function checkWinner(){
  try{
    const response=await fetch("/api/check-winner",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({board})});
    if(response.ok)return (await response.json()).result;
  }catch{}
  const result=winnerLine();return result?result.winner:null;
}
async function play(index){
  if(finished||board[index])return;
  board[index]=current;
  const result=await checkWinner();
  const detail=winnerLine();
  if(result){
    finished=true;
    if(result==="draw"){scores.draw++;status.textContent="It's a draw! 🤝";}
    else{scores[result]++;status.textContent=`Player ${result} wins! 🎉`;if(detail)detail.line.forEach(i=>cells[i].classList.add("winner"));}
    updateScores();
  }else{current=current==="X"?"O":"X";status.textContent=`Player ${current}'s turn`;}
  render();
}
cells.forEach((cell,i)=>cell.addEventListener("click",()=>play(i)));
function newRound(){board=Array(9).fill(null);current="X";finished=false;status.textContent="Player X's turn";render();}
document.querySelector("#new-round").addEventListener("click",newRound);
document.querySelector("#reset").addEventListener("click",()=>{scores.X=0;scores.O=0;scores.draw=0;updateScores();newRound();});
render();
</script>
</body>
</html>
