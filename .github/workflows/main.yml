name: Tic-Tac-Toe CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: npm run check

  test:
    name: Automated Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: npm test

  build:
    name: Package Application
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create ZIP artifact
        run: |
          mkdir -p dist
          zip -r dist/tic-tac-toe.zip app.js app.test.js package.json public README.md
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tic-tac-toe-build
          path: dist/tic-tac-toe.zip
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Optional Render Deployment
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger deployment if secret exists
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "Deployment skipped. Configure the RENDER_DEPLOY_HOOK repository secret to enable it."
          else
            curl --fail --show-error --silent --request POST "$RENDER_DEPLOY_HOOK"
            echo "Deployment trigger sent."
          fi
